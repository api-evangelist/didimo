  install: Bundled with Popul8; access via a Popul8 license (book a demo).
  official: true
  description: Bridge that imports Popul8 characters and crowds directly into Unity.
- name: Popul8 Unreal Bridge
  language: cpp
  ecosystem: unreal
  registry: proprietary
