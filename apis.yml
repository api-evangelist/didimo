aid: didimo
name: Didimo
description: >-
  Didimo is a digital human and 3D character technology company whose flagship
  product, Popul8, automates the creation of game-ready NPCs, crowds, and digital
  humans at scale. Popul8 Express lets studios generate thousands of fully-rigged,
  high-quality characters from a single 3D base template, with automated asset
  fitting, shape and rig transfer, intersection solving, material and deformable
  variation, and crowd rendering optimized for Unity and Unreal Engine. Beyond the
  desktop application, Popul8 ships a headless command-line tool (Popul8 CLI) for
  automating crowd-generation pipelines in CI/CD, plus Unity and Unreal bridges for
  bringing characters and crowds directly into game engines. Didimo is headquartered
  in Clearwater, Florida with offices in Portugal and the UK, and was backed by
  Techstars.
